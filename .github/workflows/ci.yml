name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: install
        run: dotnet tool restore && dotnet restore ClimbOn.slnx --locked-mode

      - name: build
        run: dotnet build ClimbOn.slnx -c Release --no-restore

      - name: test
        run: dotnet test ClimbOn.slnx -c Release --no-build -- RunConfiguration.TreatNoTestsAsError=true

      - name: lint
        run: dotnet format ClimbOn.slnx --verify-no-changes

      - name: spec-trace
        run: dotnet run --project tools/SpecTrace -c Release -- check

      - name: install-gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: secret-scan-selftest
        run: |
          repo="$(mktemp -d)"
          git -C "$repo" init -q
          printf 'api_key = "%s"\n' "$(openssl rand -hex 20)" > "$repo/settings.txt"
          git -C "$repo" add settings.txt
          git -C "$repo" -c user.name=ci -c user.email=ci@example.invalid commit -q -m "planted fake credential"
          status=0
          (cd "$repo" && gitleaks detect --redact --no-banner) || status=$?
          if [ "$status" -ne 1 ]; then
            echo "gitleaks exited $status on a repository with a planted credential; expected 1"
            exit 1
          fi

      - name: secret-scan
        run: gitleaks detect --redact
