# Local PostgreSQL for `dotnet run --project src/ClimbOn.Api` (Development settings).
# Trust auth on the loopback port only, so no password lives in the repo (C50).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: climbon
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - climbon-postgres:/var/lib/postgresql/data

volumes:
  climbon-postgres:
